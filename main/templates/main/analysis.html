<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>분실물 분석 (D3.js 시각화)</title>

    <style>
        body { font-family: "Malgun Gothic", sans-serif; margin: 20px; background: #f9f9f9; }
        h1, h2, h3 { text-align: center; color: #333; }
        /* 버튼 스타일은 분석 페이지 이동을 위해 유지 */
        .button {
            padding: 10px 20px;        
            border-radius: 25px / 50%; 
            border: none;
            cursor: pointer;
            color: black;
            font-weight: bold;
            font-size: 16px;
            margin: 5px;
            transition: background 0.3s, opacity 0.3s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    
    {% if show_regression or show_stats or show_boxPlot %}
    <h2>📊 분실물 데이터 정형 분석 (D3.js 사용)</h2>
    <button class="button" onclick="window.location.href='http://127.0.0.1:8000/analysis/stats/'">꺾은선그래프</button>
    <button class="button" onclick="window.location.href='http://127.0.0.1:8000/analysis/boxPlot/'">상자 수염 그래프</button>
    <button class="button" onclick="window.location.href='http://127.0.0.1:8000/analysis/regression/'">회귀 그래프</button>
    <hr>
    {% endif %}

    {% if show_regression %}
    <h1>회귀 그래프 (D3.js)</h1>
    <svg id="regressionChart" width="600" height="400"></svg>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    {{ regression_data|json_script:"data" }}
    <script>
    // ==========================================================
    // [Typical Data Visualization] - 회귀 분석 그래프 (d3.js 사용)
    // ----------------------------------------------------------
    // 목적: 지하철 이용객 수(total_people)와 분실물 수(total_lost) 사이의 선형적 관계를 파악합니다.
    //       날씨(is_rainy) 요인에 따른 데이터 분포 차이를 시각화합니다.
    //
    // 1. 데이터 준비: Django에서 전달된 `regression_data`를 로드합니다.
    // 2. 스케일 정의: d3.scaleLinear()를 사용하여 이용객 수(x)와 분실물 수(y)를
    //    SVG 좌표로 변환하는 스케일을 설정합니다.
    // 3. 데이터 시각화 (산점도):
    //    - d3.selectAll("circle").data(data).enter().append("circle") 패턴을 사용해
    //      각 데이터 포인트를 점으로 표현합니다. (d3의 핵심인 데이터 바인딩)
    //    - 점의 색상을 `is_rainy` 변수에 따라 다르게 설정하여 날씨 요인(맑음/비)을 구분합니다.
    // 4. 회귀선 추가:
    //    - JavaScript 함수 `linearRegression`으로 기울기(slope)와 절편(intercept)을 직접 계산합니다.
    //    - d3.line() 생성기를 이용해 계산된 회귀선을 빨간색 선으로 그려 관계를 명확히 보여줍니다.
    // 5. 축(Axis) 추가: d3.axisBottom(x)와 d3.axisLeft(y)를 사용하여 스케일에 맞는 축을 렌더링합니다.
    // ==========================================================
    const data = JSON.parse(document.getElementById('data').textContent);
    const svg = d3.select("#regressionChart");

    const width = +svg.attr("width") - 50;
    const height = +svg.attr("height") - 50;

    // x, y 스케일
    const x = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.total_people) * 1.1])
        .range([50, width]);

    const y = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.total_lost) * 1.1])
        .range([height, 50]);

    // 점 색
    const color = d => d.is_rainy ? "steelblue" : "orange";

    // 점 그리기
    svg.selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", d => x(d.total_people))
        .attr("cy", d => y(d.total_lost))
        .attr("r", 5)
        .attr("fill", color)
        .attr("opacity", 0.7);

    // --- 선형 회귀 계산 ---
    function linearRegression(data) {
        const n = data.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        data.forEach(d => {
            sumX += d.total_people;
            sumY += d.total_lost;
            sumXY += d.total_people * d.total_lost;
            sumXX += d.total_people * d.total_people;
        });
        const slope = (n*sumXY - sumX*sumY) / (n*sumXX - sumX*sumX);
        const intercept = (sumY - slope*sumX)/n;
        return {slope, intercept};
    }

    const {slope, intercept} = linearRegression(data);

    // 회귀선용 좌표
    const xVals = [0, d3.max(data, d => d.total_people)];
    const yVals = xVals.map(x => slope*x + intercept);

    // 회귀선 그리기
    const line = d3.line()
        .x(d => x(d[0]))
        .y(d => y(d[1]));

    svg.append("path")
        .datum(d3.zip(xVals, yVals))
        .attr("fill", "none")
        .attr("stroke", "red")
        .attr("stroke-width", 2)
        .attr("d", line);

    // 축 그리기
    svg.append("g")
        .attr("transform", `translate(0, ${height})`)
        .call(d3.axisBottom(x));

    svg.append("g")
        .attr("transform", `translate(50, 0)`)
        .call(d3.axisLeft(y));
    </script>

    {% endif %}

    {% if show_stats %}
    <h1>꺾은선 그래프 (D3.js)</h1>
    <svg id="lineChart" width="600" height="400"></svg>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
    // ==========================================================
    // [Typical Data Visualization] - 시계열 꺾은선 그래프 (d3.js 사용)
    // ----------------------------------------------------------
    // 목적: 시간 경과에 따른 '총 분실물 수'와 '강수량' 트렌드를 비교 분석합니다.
    //
    // 1. 데이터 파싱: d3.timeParse("%Y-%m-%d")를 사용하여 날짜 문자열을 시간 객체로 변환합니다.
    // 2. 스케일 정의:
    //    - x축은 d3.scaleTime()를 사용하여 시간의 흐름을 정확히 반영합니다. (시계열 분석)
    //    - y축은 d3.scaleLinear()로 분실물 수와 강수량의 최댓값을 포함하도록 설정합니다.
    // 3. 시각화 구현:
    //    - d3.line() 생성기를 이용해 `data1` (총 분실물)과 `data2` (강수량)를 각각 다른 색상(steelblue, orange)의 선으로 그립니다.
    // 4. 범례(Legend) 추가: 별도로 SVG 요소로 추가하여 각 선이 무엇을 나타내는지 명확히 합니다.
    // 5. 축 렌더링: x축은 날짜 포맷(`%m-%d`), y축은 값 스케일을 표시합니다.
    // ==========================================================
    const parseDate = d3.timeParse("%Y-%m-%d");

    // Django 템플릿 변수가 삽입될 위치입니다. (예시 데이터 구조를 가정)
    const data1 = {{lineGraph|safe}}; // 총 분실물 데이터
    const data2 = {{lineGraph_weather|safe}}; // 강수량 데이터

    const svg = d3.select("#lineChart");
    const width = +svg.attr("width") - 50;   // 여백 고려
    const height = +svg.attr("height") - 50;

    [data1, data2].forEach(arr => {
        arr.forEach(d => d.date = parseDate(d.date));
    });

    const allData = data1.concat(data2);

    //스케일
    const x = d3.scaleTime()
        .domain(d3.extent(allData, d => d.date))
        .range([50, width]);

    const y = d3.scaleLinear()
                .domain([0, d3.max(allData, d => d.value)])
                .range([height, 50]);
                
    const line = d3.line()
               .x(d => x(d.date))
               .y(d => y(d.value));

    // 그래프 그리기 (총 분실물)
    svg.append("path")
        .datum(data1)
        .attr("fill", "none")
        .attr("stroke", "steelblue")
        .attr("stroke-width", 2)
        .attr("d", line);

    // 그래프 그리기 (강수량)
    svg.append("path")
        .datum(data2)
        .attr("fill", "none")
        .attr("stroke", "orange")
        .attr("stroke-width", 2)
        .attr("d", line);

    // X축
    svg.append("g")
        .attr("transform", `translate(0, ${height})`)
        .call(d3.axisBottom(x).ticks(5).tickFormat(d3.timeFormat("%m-%d")));

    // Y축
    svg.append("g")
        .attr("transform", `translate(50, 0)`)
        .call(d3.axisLeft(y));

    //라벨 붙이기
    const legend = svg.append("g")
                .attr("transform", `translate(${width - 120}, 20)`); // 위치 조정

    const lines = [
        {color: "steelblue", label: "총 분실물"},
        {color: "orange", label: "강수량"}
    ];

    lines.forEach((lineObj, i) => {
        const g = legend.append("g")
                        .attr("transform", `translate(0, ${i*20})`);

        // 색상 박스
        g.append("rect")
        .attr("width", 10)
        .attr("height", 10)
        .attr("fill", lineObj.color);

        // 텍스트
        g.append("text")
        .attr("x", 15)
        .attr("y", 10)
        .text(lineObj.label)
        .attr("font-size", "12px")
        .attr("alignment-baseline", "middle");
    });
    </script>
    {% endif %}

    {% if show_boxPlot %}
    <h1>상자 수염 그래프 (D3.js)</h1>
    <svg id="boxPlot" width="600" height="400"></svg>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
    // ==========================================================
    // [Typical Data Visualization] - 상자 수염 그래프 (d3.js 사용)
    // ----------------------------------------------------------
    // 목적: '비 오는 날'과 '맑은 날'의 분실물 수 분포(중앙값, 사분위수, 이상치)를 비교 분석합니다.
    //
    // 1. 통계 계산:
    //    - 사용자 정의 함수 `boxStats` 내에서 d3.quantile()을 사용하여 Q1, 중앙값, Q3,
    //      수염 범위(Lower/Upper) 및 이상치(Outliers)를 계산합니다.
    // 2. 스케일 정의:
    //    - x축은 범주형 데이터를 위한 d3.scaleBand()를, y축은 선형 스케일(`d3.scaleLinear`)을 사용합니다.
    // 3. 상자 그리기:
    //    - 계산된 Q1~Q3 값을 기반으로 사각형(`rect`)을 그려 상자(Box)를 표현하고 중앙값을 선으로 표시합니다.
    // 4. 수염/이상치:
    //    - 수염(`line`)을 그려 데이터의 범위와 변동성을 표시하고, 이상치(`outliers`)는 빨간색 원(`circle`)으로 표시합니다.
    // ==========================================================
    // Django 템플릿 변수가 삽입될 위치입니다.
    const dataRainy = {{ box_rainy_date|safe }}; // 비 오는 날 분실물 수 리스트
    const dataNotRainy = {{ box_sunny_date|safe }}; // 맑은 날 분실물 수 리스트

    const categories = ['Rainy', 'Not Rainy'];
    const allData = [dataRainy, dataNotRainy];

    const svg = d3.select("#boxPlot");
    const width = +svg.attr("width") - 50;
    const height = +svg.attr("height") - 50;

    const x = d3.scaleBand()
        .domain(categories)
        .range([50, width])
        .padding(0.4);

    const y = d3.scaleLinear()
        .domain([0, d3.max(allData.flat()) * 1.1])
        .range([height, 50]);

    // 상자 수염 계산 함수 (d3.quantile 사용)
    function boxStats(values) {
        values.sort(d3.ascending);
        const q1 = d3.quantile(values, 0.25);
        const median = d3.quantile(values, 0.5);
        const q3 = d3.quantile(values, 0.75);
        const iqr = q3 - q1;
        const lower = d3.max([d3.min(values), q1 - 1.5 * iqr]);
        const upper = d3.min([d3.max(values), q3 + 1.5 * iqr]);
        const outliers = values.filter(v => v < lower || v > upper);
        return {q1, median, q3, lower, upper, outliers};
    }

    // 상자 수염 그리기
    allData.forEach((values, i) => {
        const stats = boxStats(values);
        const cx = x(categories[i]);

        // 수염
        svg.append("line")
            .attr("x1", cx + x.bandwidth()/2)
            .attr("x2", cx + x.bandwidth()/2)
            .attr("y1", y(stats.lower))
            .attr("y2", y(stats.upper))
            .attr("stroke", "black");

        // 상자
        svg.append("rect")
            .attr("x", cx)
            .attr("y", y(stats.q3))
            .attr("width", x.bandwidth())
            .attr("height", y(stats.q1) - y(stats.q3))
            .attr("fill", i === 0 ? "steelblue" : "orange")
            .attr("stroke", "black");

        // 중앙값
        svg.append("line")
            .attr("x1", cx)
            .attr("x2", cx + x.bandwidth())
            .attr("y1", y(stats.median))
            .attr("y2", y(stats.median))
            .attr("stroke", "black");

        // 이상치
        svg.selectAll(`.outlier-${i}`)
            .data(stats.outliers)
            .enter()
            .append("circle")
            .attr("cx", cx + x.bandwidth()/2)
            .attr("cy", d => y(d))
            .attr("r", 3)
            .attr("fill", "red");
    });

    // x축
    svg.append("g")
        .attr("transform", `translate(0, ${height})`)
        .call(d3.axisBottom(x));

    // y축
    svg.append("g")
        .attr("transform", `translate(50, 0)`)
        .call(d3.axisLeft(y));
    </script>

    {% endif %}

</body>
</html>

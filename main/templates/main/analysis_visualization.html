<!DOCTYPE html>

<head>

</head>
<body>
    <!--시각화 섹션-->
    <div id="visualization-section" class="hidden-section">

        <div id="toggle-weather"> <!--버튼 토글-->
            <span id="current-date"></span>
            <button id="toggle-weather-btn">날씨 토글 ☀️➡️🌧️</button>
            <span></span>
        </div>

        <div id="subway"> <!--지하철 이미지-->
            <svg
                id="scene"
                width="1200"
                height="350"
                viewBox="0 0 1200 350"
                xmlns="http://www.w3.org/2000/svg"
                style="border-radius: 45px; box-shadow: 0 10px 25px rgba(0,0,0,0.08)"
            >

                <!-- 전체 배경 (프레임) -->
                <rect x="0" y="0" width="1200" height="350" rx="45" fill="#d8dee6" />

                <!-- 창문 영역 -->
                <rect id="window" x="0" y="0" width="1200" height="260" rx="45" fill="#c9dff2" />
                <rect x="0" y="0" width="1200" height="260" rx="45" fill="rgba(255,255,255,0.25)" />

                <!-- 각 창문 패널 구분(옅은 기둥) -->
                <rect x="150" y="0" width="10" height="260" fill="rgba(255,255,255,0.4)" />
                <rect x="300" y="0" width="10" height="260" fill="rgba(255,255,255,0.4)" />
                <rect x="450" y="0" width="10" height="260" fill="rgba(255,255,255,0.4)" />
                <rect x="600" y="0" width="10" height="260" fill="rgba(255,255,255,0.4)" />
                <rect x="750" y="0" width="10" height="260" fill="rgba(255,255,255,0.4)" />
                <rect x="900" y="0" width="10" height="260" fill="rgba(255,255,255,0.4)" />
                <rect x="1050" y="0" width="10" height="260" fill="rgba(255,255,255,0.4)" />

                <!-- 상단 손잡이 바 -->
                <rect x="50" y="70" width="1100" height="10" fill="#8a93a3" opacity="0.7" />

                <!-- 손잡이들 -->
                <g stroke="#8a93a3" stroke-width="5" opacity="0.7" fill="none">
                    <line x1="200" x2="200" y1="80" y2="120" />
                    <circle cx="200" cy="140" r="18" />

                    <line x1="350" x2="350" y1="80" y2="120" />
                    <circle cx="350" cy="140" r="18" />

                    <line x1="500" x2="500" y1="80" y2="120" />
                    <circle cx="500" cy="140" r="18" />

                    <line x1="650" x2="650" y1="80" y2="120" />
                    <circle cx="650" cy="140" r="18" />

                    <line x1="800" x2="800" y1="80" y2="120" />
                    <circle cx="800" cy="140" r="18" />

                    <line x1="950" x2="950" y1="80" y2="120" />
                    <circle cx="950" cy="140" r="18" />
                </g>

                <!-- 바닥 영역 -->
                <rect x="0" y="260" width="1200" height="90" fill="#c7cdd7" />

                <!--사람 이미지-->
                <defs>
                    <g id="person" fill="#616b7a">
                        
                        <!-- 머리 -->
                        <circle cx="40" cy="25" r="12" />

                        <!-- 반원(어깨 부분) -->
                        <path d="
                        M 20 55
                        Q 40 35 60 55
                        Z
                        " />

                        <!-- 몸통 직사각형 -->
                        <rect x="20" y="55" width="40" height="45" />

                    </g>
                </defs>

                <defs>
                    <g id="bag">
                    <!-- 가방 몸통 -->
                    <rect x="30" y="50" width="140" height="80" rx="10" ry="10" fill="#8B4513" />

                    <!-- 가방 덮개 -->
                    <rect x="30" y="40" width="140" height="20" rx="5" ry="5" fill="#8B4513" />

                    <!-- 손잡이 -->
                    <path d="M 60 40 Q 100 10 140 40" stroke="#8B4513" stroke-width="6" fill="none" />
                    </g>
                </defs>
                
            </svg>
        </div>
        <div id="stats-line"> <!-- 값 표시 -->
            <div class="stats-box">
                <p>오늘 탑승 인원</p>
                <p><span id="num-people"></span>명</p>
            </div>
            <div class="stats-box">
                <p>분실물 개수</p>
                <p><span id="num-lostitem"></span>개</p>
            </div>
            <div class="stats-box">
                <p>강수</p>
                <p id="num-rain"></p>
            </div>
        </div>
        <div id="actDiv"> <!-- 가설증명 대화로그 -->
            <div>
                <p id="act">ACT.1 가설</p>
            </div>
            <div>
                <h1 id="context-title">비가 오면 분실물이 많아질까?</h1>
                <p id="context-1">비 오는 날은 짐도 많고 바닥도 미끄러워서 정신이 없죠. <br> 보통은 비 오는 날 분실물이 더 많을 거라고 생각합니다.</p>
                <p id="context-2">(버튼을 눌러 날씨를 바꿔보세요. 분실물 양이 어떻게 변하나요?)</p>
            </div>
            <div id="context-3" style="width:400px;"></div>
            <div>
                <button id="before-btn" class="button">이전</button>
                <button id="next-btn" class="button">다음으로</button>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-3.3.0.min.js"></script>
    <script>
        let date = "{{recent_sunny}}"
        let parts = date.match(/\d+/g); 
        let date_formatted = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
        let totalBoardings = {{ total_boardings|safe }};
        let NUM_PEOPLE_boardings = totalBoardings[date_formatted] / 1000000;
        let totalAlightings = {{total_alightings|safe}};
        let NUM_PEOPLE = totalBoardings[date_formatted] + totalAlightings[date_formatted];
        let lostitems = {{recent_sunny_lostitem}};

        document.getElementById('current-date').textContent = date;
        document.getElementById('num-people').textContent = NUM_PEOPLE.toLocaleString();
        document.getElementById('num-lostitem').textContent = lostitems.toLocaleString();
        document.getElementById('num-rain').textContent = "맑음";

        const ENTER_SPEED = 15;        // 기본 이동 속도
        const WAIT_TIME = 1500;       // 내부 대기 시간 (ms)

        const START_X = -100;         // 사람 이미지 시작점
        const END_X = 1400;           // 나가는 최종 지점

        const ENTER_TARGET_MIN = 250;  // 지하철 내부 좌측
        const ENTER_TARGET_MAX = 800;  // 지하철 내부 우측
        
        const scene = document.getElementById("scene");

        function createPerson() {
            const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
            use.setAttribute("href", "#person");  // defs 안에 정의한 id

            // 초기 위치 (transform 쓰지 않음!)
            use.setAttribute("x", START_X);
            use.setAttribute("y", 200 + Math.random() * 30); // 약간 다른 세로 위치

            scene.appendChild(use);

            // 목표 지점도 랜덤
            const targetX = Math.random() * (ENTER_TARGET_MAX - ENTER_TARGET_MIN) + ENTER_TARGET_MIN;

            // 약간씩 다른 시작 지연
            const startDelay = Math.random() * 300;

            setTimeout(() => moveIn(use, targetX), startDelay);
        }
        
        const MIN_X = 0;
        const MAX_X = 1000;
        const FIXED_Y = 270; // y 고정
        const SCALE = 0.3;
        
        function dropBag(x) {
            const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
                
            if (x == true) {
                const bags = scene.querySelectorAll("use[href='#bag']");
                bags.forEach(bag => bag.remove());
            }
            else {
                //날씨에 따라 떨어지는 분실물 확률 다르게 하기
                if (date == "{{recent_sunny}}") 
                {
                    let random = 0.8;
                }
                else 
                {
                    let random = 0.2;
                }

                if (Math.random() < random) {
                    use.setAttribute("href", "#bag");  // defs 안에 정의한 id

                    const randomX = x + Math.random() * 10;
                    use.setAttribute("transform", `translate(${randomX},${FIXED_Y}) scale(${SCALE})`);

                    scene.appendChild(use);
                }
            }
        }

        function moveIn(img, targetX) {
            function step() {
                let x = parseFloat(img.getAttribute("x"));
                if (x < targetX) {
                    // 사람마다 다르게: 속도 약간 랜덤 구성
                    const speed = ENTER_SPEED + Math.random() * 1.2;
                    img.setAttribute("x", x + speed);
                    requestAnimationFrame(step);
                } else {
                    setTimeout(() => dropBag(x), WAIT_TIME)
                    setTimeout(() => moveOut(img), WAIT_TIME); // 도착 → 내부 대기
                }
            }
            step();            
        }

        function moveOut(img) {
            function step() {
                let x = parseFloat(img.getAttribute("x"));
                if (x < END_X) {
                    const speed = ENTER_SPEED + Math.random() * 1.2;
                    img.setAttribute("x", x + speed);
                    requestAnimationFrame(step);
                } else {
                    img.remove(); // 화면에서 제거
                }
            }
            step();        

        }

        // N명 생성
        for (let i = 0; i < NUM_PEOPLE_boardings; i++) {
            createPerson(i);
        }

        //날씨 토글
        const toggleBtn = document.getElementById("toggle-weather-btn");
        let isRainy = false; // false → 맑음, true → 비

        toggleBtn.addEventListener("click", () => {
            // 배경, 창문 요소 가져오기
            const windowRects = scene.querySelectorAll("#window");
            
            if (isRainy) {
                // 맑은 날로 변경
                windowRects.forEach(rect => {
                    if (rect.getAttribute("fill").includes("rgba")) {
                        rect.setAttribute("fill", "rgba(255,255,255,0.25)");
                    } 
                    else {
                        rect.setAttribute("fill", "#c9dff2");
                    }
                });

                //화창한 날로 바꾸기
                date = "{{recent_sunny}}";
                parts = date.match(/\d+/g);
                date_formatted = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                totalBoardings = {{ total_boardings|safe }};
                NUM_PEOPLE_boardings = totalBoardings[date_formatted] / 1000000;
                totalAlightings = {{total_alightings|safe}};
                NUM_PEOPLE = totalBoardings[date_formatted] + totalAlightings[date_formatted];

                lostitems = {{recent_sunny_lostitem}}; 
                document.getElementById('num-lostitem').textContent = lostitems.toLocaleString();
                
                toggleBtn.textContent = "날씨 토글 ☀️➡️🌧️"
                document.getElementById('num-rain').textContent = "맑음"

                //이전 요소 지우기
                dropBag(true);
                const people = scene.querySelectorAll("use[href='#person']");
                people.forEach(people => people.remove());

                //사람 생성
                for (let i = 0; i < NUM_PEOPLE_boardings; i++) { 
                    createPerson(i);
                }
            } 
            else {
                // 비 오는 날로 변경 (어두운 창문)
                windowRects.forEach(rect => {
                    if (rect.getAttribute("fill").includes("rgba")) {
                        rect.setAttribute("fill", "rgba(100,100,150,0.3)");
                    } 
                    else {
                        rect.setAttribute("fill", "#7a8ebc");
                    }
                });

                //비 오는 날로 바꾸기
                date = "{{recent_rainy}}";
                parts = date.match(/\d+/g);
                date_formatted = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                totalBoardings = {{ total_boardings|safe }};
                NUM_PEOPLE_boardings = totalBoardings[date_formatted] / 1000000;
                totalAlightings = {{total_alightings|safe}};
                NUM_PEOPLE = totalBoardings[date_formatted] + totalAlightings[date_formatted];
                
                lostitems = {{recent_rainy_lostitem}};
                document.getElementById('num-lostitem').textContent = lostitems.toLocaleString();
                
                toggleBtn.textContent = "날씨 토글 🌧️➡️☀️"
                document.getElementById('num-rain').textContent = {{recent_rain_mm}} + "mm"

                //이전 요소 지우기
                dropBag(true);
                const people = scene.querySelectorAll("use[href='#person']");
                people.forEach(people => people.remove());

                //사람 생성
                for (let i = 0; i < NUM_PEOPLE_boardings; i++) {
                    createPerson(i);
                }
            }

            isRainy = !isRainy; // 상태 토글
            document.getElementById('current-date').textContent = date;
        });
    </script>
    <script>
        //가설증명 대화
        const beforeBtn = document.getElementById("before-btn");
        const nextBtn = document.getElementById("next-btn");
        let page = 0;

        beforeBtn.addEventListener("click", () => { 
            if (page > 0) {
                page -= 1; 
                pageChange();
            }
        })
        nextBtn.addEventListener("click", () => { 
            if (page < 3) {
                page += 1; 
                pageChange();
            } 
        })

        const act = document.getElementById("act");
        const context_title = document.getElementById("context-title");
        const context_1 = document.getElementById("context-1");
        const context_2 = document.getElementById('context-2');
        const context_3 = document.getElementById('context-3');
        function pageChange() {
            if (page == 0) {
                act.innerHTML = "ACT 1. 가설"
                context_title.innerHTML = "비가 오면 우산 때문에 더 많이 잃어버릴까?"
                context_1.innerHTML = "비 오는 날은 짐도 많고 바닥도 미끄러워서 정신이 없죠. <br> 보통은 비 오는 날 분실물이 더 많을 거라고 생각합니다."
                context_2.innerHTML = "(버튼을 눌러 날씨를 바꿔보세요. 분실물 양이 어떻게 변하나요?)"
                
                context_3.style.height = '1px';
                Plotly.purge('context-3')
            }
            else if (page == 1) {
                act.innerHTML = "ACT 2. 데이터의 반전"
                context_title.innerHTML = "사실은 맑은 날에 더 많이 잃어버립니다!"
                context_1.innerHTML = "데이터를 분석해보니 맑은 날의 분실물 발생량이 {{lostitem_percent_increse|floatformat:2}}배 더 높았습니다. <br> 우리의 직관과는 정반대의 결과가 나온 것이죠."
                //23% 변경 필요?
                context_2.innerHTML = ""

                const data = [{ 
                    x: ['비 오는 날','맑은 날'],
                    y: [{{total_rainy_lostitem}}, {{total_sunny_lostitem}}],
                    type: 'bar'
                }];
                const layout = {
                    margin: { l: 30, r: 10, t: 10, b: 30 }  // left, right, top, bottom
                };
                context_3.style.height = '200px';
                Plotly.newPlot('context-3', data, layout);
            }
            else {
                act.textContent = "ACT 3. 결론"
                context_title.innerHTML = "범인은 날씨가 아니라 '혼잡도'였습니다"
                context_1.innerHTML = "비가 오면 사람들이 외출을 줄여 대중교통 이용객 자체가 줄어듭니다. <br> '사람이 적으면 → 분실물도 적다'는 단순한 진리였죠. <br> 날씨는 직접적인 원인이 아니라 간접적인 배경이었을 뿐입니다."
                context_2.innerHTML = ""
                
                context_3.style.height = '1px';
                Plotly.purge('context-3')
            }
        }

    </script>
</body>

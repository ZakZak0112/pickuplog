<h1>날씨별 분실물 & 승하차 인원 분석</h1>
<table border="1">
<tr>
    <th>노선</th>
    <th>역명</th>
    <th>비 여부</th>
    <th>분실물 수</th>
    <th>승차 합계</th>
    <th>하차 합계</th>
    <th>총 승하차</th>
</tr>
{% for row in report %}
<tr>
    <td>{{ row.line }}</td>
    <td>{{ row.station_std }}</td>
    <td>{{ row.is_rainy }}</td>
    <td>{{ row.lost_count }}</td>
    <td>{{ row.total_boardings }}</td>
    <td>{{ row.total_alightings }}</td>
    <td>{{ row.total_passengers }}</td>
</tr>
{% endfor %}
</table>
